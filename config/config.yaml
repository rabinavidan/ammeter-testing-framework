testing:
  # Set any two of the three sampling values; the third is derived
  # (count = duration * frequency). If all three are set they must agree.
  sampling:
    measurements_count: 10
    total_duration_seconds: NULL
    sampling_frequency_hz: 5
  request_timeout_seconds: 2.0
  # Mains frequency (50 or 60). Sampling below twice this aliases any mains ripple; the run warns
  # and records the alias frequency. NULL turns the check off.
  mains_frequency_hz: 50

ammeters:
  # plausible_range_a (optional): readings outside [low, high] are recorded as errors, not data.
  # Here: exactly what each emulator's formula can produce.
  greenlee:
    port: 5000
    command: "MEASURE_GREENLEE -get_measurement"
    plausible_range_a: [0.01, 100]       # 1..10 V / 0.1..100 Ohm
  entes:
    port: 5001
    command: "MEASURE_ENTES -get_data"
    plausible_range_a: [5, 200]          # 0.01..0.1 T x 500..2000
  circutor:
    port: 5002
    command: "MEASURE_CIRCUTOR -get_measurement"
    plausible_range_a: [0.001, 0.1]      # 10 x 0.1..1 V x 0.001..0.01 s

analysis:
  # Any of: mean, median, std_dev, min, max, range, coefficient_of_variation.
  # Leave empty to compute all of them.
  statistical_metrics: [mean, median, std_dev, min, max, range, coefficient_of_variation]
  visualization:
    enabled: true
    output_dir: results/plots
    # Per-run PNGs, any of: time_series, histogram, control_chart. Leave empty for all.
    # The cross-run comparison chart is drawn on request (framework.plot_comparison).
    plot_types: [time_series, histogram, control_chart]
  control_chart:
    # NULL = automatic: 3 sigma and runs of 9 up to 40 readings, widening for longer runs so a stable
    # process isn't flagged just for being long. A number fixes the rule for every run length.
    sigma_limit: NULL
    run_length: NULL
  accuracy:
    # Known true current in amps. Without it only relative spread (robust CV) can be ranked:
    # the emulators have no shared true current to measure accuracy against.
    reference_current_a: NULL
    confidence_level: 0.95
    bootstrap_resamples: 2000
    random_seed: 0              # fixed so a re-run of the same data gives the same intervals
    output_dir: results/accuracy

result_management:
  # Each run is saved as <archive_dir>/<test_id>.json with its metadata
  enabled: true
  archive_dir: results/archive

logging:
  output_dir: results/logs      # one log file per run: <timestamp>_<test_id>.log

error_simulation:
  # Injects faults into the emulators' replies (see Ammeters/error_simulation.py).
  # Applies to emulators started with ErrorSimulator.from_config(...), e.g. by examples/run_tests.py.
  enabled: false
  seed: 0                     # NULL for a different fault pattern every run
  faults:                     # shared by every ammeter; omitted faults are off
    no_response: {probability: 0.03, delay_seconds: 3.0}   # must exceed testing.request_timeout_seconds
    dropped_connection: {probability: 0.03}
    corrupted_response: {probability: 0.03}
    truncated_response: {probability: 0.02}               # reply cut off before its terminator
    latency: {probability: 0.10, delay_seconds: 0.05}
    fragmented_response: {probability: 0.10, gap_seconds: 0.02}   # valid reply split in two packets
    noise: {relative_sd: 0.02}
    spike: {probability: 0.02, factor: 10}
    mains_ripple: {amplitude_relative: 0.0, frequency_hz: 50}     # e.g. 0.05 for 5 % ripple
  ammeters:                   # optional per-ammeter overrides, merged over `faults`
    entes:
      offset: {relative: 0.05}                  # miscalibrated: reads 5% high
    circutor:
      drift: {relative_per_reading: 0.001}      # error grows 0.1% per reading

accuracy_verification:
  # Multi-point accuracy check of realistic instrument models (Ammeters/instrument_model.py) against a
  # reference current, like a calibration lab: see src/testing/calibration.py and README, "Accuracy
  # verification". The original emulators are unaffected; this is used by the acceptance tests.
  points_percent_of_range: [0, 10, 50, 90, 100, -10, -50, -100]   # negative points skipped for AC
  readings_per_point: 10
  sampling_frequency_hz: 50
  reference_relative_uncertainty: 0.0001     # the calibrator's own expanded (k = 2) uncertainty
  seed: 0
  instruments:
    # Datasheet-style models. accuracy = +/-(percent of reading + counts x resolution)
    greenlee:                  # shunt meter: DC and AC, small burden resistance
      test_signal: dc
      range_a: 10
      resolution_a: 0.001
      gain_error: 0.003
      offset_a: 0.001
      noise_floor_a: 0.0005
      relative_noise: 0.0005
      measures_dc: true
      burden_ohm: 0.01
      accuracy_percent_of_reading: 0.5
      accuracy_counts: 3
    entes:                     # Hall-effect clamp: DC and AC, no burden (non-contact), larger offset
      test_signal: dc
      range_a: 200
      resolution_a: 0.1
      gain_error: -0.008
      offset_a: 0.2
      noise_floor_a: 0.05
      relative_noise: 0.002
      measures_dc: true
      burden_ohm: 0
      accuracy_percent_of_reading: 1.5
      accuracy_counts: 5
    circutor:                  # Rogowski coil: senses dI/dt, so AC only
      test_signal: ac
      range_a: 100
      resolution_a: 0.01
      gain_error: 0.005
      offset_a: 0
      noise_floor_a: 0.01
      relative_noise: 0.002
      measures_dc: false
      burden_ohm: 0
      accuracy_percent_of_reading: 1.0
      accuracy_counts: 5
  supply_sweep:
    # The setup in the specification's diagram: a 0-12 V supply powering the embedded board,
    # with the ammeter in series measuring the board's current.
    instrument: greenlee
    voltages_v: [0, 1, 2, 2.5, 3, 3.3, 5, 9, 12]
    board: {brownout_v: 2.7, active_current_a: 0.045, sleep_current_a: 0.000025}
    max_burden_fraction: 0.02  # the meter may take at most 2 % of the supply voltage
