[pytest]
testpaths = tests
pythonpath = .
# A missing glyph or other matplotlib problem shows up as a UserWarning; fail on it
filterwarnings =
    error::UserWarning
markers =
    unit: pure logic: no sockets, no threads (tests/unit; enforced by tests/unit/conftest.py)
    integration: starts emulators, opens sockets or runs the framework end to end (tests/integration)
    acceptance: test runs of the real ammeters and instruments, as the specification defines a test (tests/acceptance)
    regression: every test (assigned automatically): the full regression suite
    sanity: small hand-picked smoke set, about 10 s, one check per core feature; gates CI before the regression
    bugfix: guards a fix to the provided code (see README, "Fixes to the provided code")
    timing: asserts on wall-clock time; run on a quiet machine (the logic is also covered with a virtual clock)
    slow: statistical checks that take a few seconds
