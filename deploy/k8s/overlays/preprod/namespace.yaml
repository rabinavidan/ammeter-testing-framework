apiVersion: v1
kind: Namespace
metadata:
  name: ammeter-preprod
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: env-quota
  namespace: ammeter-preprod
spec:
  hard: {requests.cpu: "4", requests.memory: 4Gi, limits.cpu: "8", limits.memory: 8Gi, pods: "20",
         persistentvolumeclaims: "2"}
