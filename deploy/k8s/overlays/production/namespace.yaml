apiVersion: v1
kind: Namespace
metadata:
  name: ammeter-production
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: env-quota
  namespace: ammeter-production
spec:
  hard: {requests.cpu: "1", requests.memory: 1Gi, limits.cpu: "2", limits.memory: 2Gi, pods: "5"}
