# regression: the full regression (all but wall-clock `timing` tests) sharded over 4 worker pods spread across
# nodes, plus a nightly CronJob of the same. Emulators run 2 replicas each (the env-check spreads over them).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ammeter-regression
resources: [namespace.yaml, ../../base, nightly.yaml]
labels:
  - pairs: {qa.ammeter/environment: regression}
    includeSelectors: false
replicas:
  - {name: greenlee, count: 2}
  - {name: entes, count: 2}
  - {name: circutor, count: 2}
patches:
  - target: {kind: Job, name: test-run}
    patch: |
      - {op: replace, path: /spec/completions, value: 4}
      - {op: replace, path: /spec/parallelism, value: 4}
      - {op: replace, path: /spec/maxFailedIndexes, value: 4}
      - {op: replace, path: /spec/template/spec/containers/0/env/0/value, value: "4"}
      - {op: replace, path: /spec/template/spec/containers/0/env/1/value, value: "regression and not timing"}
