# Environment check: the framework run against the ammeters DEPLOYED in this environment (emulator Services, or
# real devices in production), using the environment's config (hosts = Service names). Fails if any reading fails.
# This is what tells you the environment works; the sharded test run tells you the code works.
apiVersion: batch/v1
kind: Job
metadata:
  name: env-check
  labels: {app.kubernetes.io/name: env-check, app.kubernetes.io/component: env-check}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app.kubernetes.io/name: env-check, app.kubernetes.io/component: env-check, qa.ammeter/client: "true"}
    spec:
      restartPolicy: Never
      serviceAccountName: ammeter-qa
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        # Wait until the ammeters answer on their Service ports (deployments may still be rolling out)
        - name: wait-for-ammeters
          image: ammeter-qa:test
          imagePullPolicy: IfNotPresent
          command: ["python", "-c"]
          args:
            - |
              import socket, time, yaml
              ammeters = yaml.safe_load(open("/config/config.yaml"))["ammeters"]
              for name, a in ammeters.items():
                  for attempt in range(60):
                      try:
                          socket.create_connection((a["host"], a["port"]), timeout=2).close(); break
                      except OSError:
                          time.sleep(2)
                  else:
                      raise SystemExit(f"{name} at {a['host']}:{a['port']} never answered")
                  print(f"{name} reachable at {a['host']}:{a['port']}")
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: config, mountPath: /config}]
      containers:
        - name: check
          image: ammeter-qa:test
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "examples.run_tests", "--config", "/config/config.yaml", "--no-emulators",
                    "--fail-on-errors"]
          env:
            - {name: MPLCONFIGDIR, value: /tmp/matplotlib}
            - {name: HOME, value: /tmp}
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: results, mountPath: /app/results}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, configMap: {name: ammeter-config}}
        - {name: results, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
