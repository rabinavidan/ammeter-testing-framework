# One-word entry points for reviewers (needs only Docker):
#   docker compose run --rm tests        lint, unit, sanity, regression          (~40 s after the first build)
#   docker compose run --rm sanity       the 6-test smoke set                    (~10 s)
#   docker compose run --rm unit         unit layer with coverage                (~8 s)
#   docker compose run --rm demo         end-to-end demo; charts/archive/logs in ./results
#   docker compose run --rm report       full regression + Allure report in ./reports/allure-report.html
services:
  tests:
    build: { context: ., target: test }
    image: ammeter-qa:test
    command: ["python", "tools/check.py", "ci", "--parallel"]

  sanity:
    image: ammeter-qa:test
    build: { context: ., target: test }
    command: ["python", "tools/check.py", "sanity"]

  unit:
    image: ammeter-qa:test
    build: { context: ., target: test }
    command: ["python", "tools/check.py", "unit"]

  demo:
    image: ammeter-qa:test
    build: { context: ., target: test }
    command: ["python", "-m", "examples.run_tests"]
    volumes:
      - ./results:/app/results

  report:
    build: { context: ., target: report }
    image: ammeter-qa-report:latest
    volumes:
      - ./reports:/app/reports
