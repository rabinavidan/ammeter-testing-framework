# Nightly: everything, including the wall-clock `timing` tests (GitHub's runners are quiet at night), and an
# Allure report kept as an artifact for 30 days. Also runnable by hand from the Actions tab.
name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - run: python tools/check.py all --allure allure-results
      - uses: actions/setup-java@v4
        if: always()
        with:
          distribution: temurin
          java-version: "21"
      - if: always()
        run: |
          npm install -g allure-commandline@2
          allure generate allure-results -o allure-report --clean --single-file
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-allure-report
          path: allure-report/index.html
          retention-days: 30
