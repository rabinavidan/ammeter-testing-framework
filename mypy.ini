[mypy]
# The packages have no __init__.py (namespace packages); resolve modules from the repo root
files = Ammeters, src, tools, evals, main.py, examples
explicit_package_bases = True
namespace_packages = True
ignore_missing_imports = True
# Annotated functions are checked; unannotated ones (much of the provided code) are not, yet
check_untyped_defs = False
warn_unused_ignores = True
